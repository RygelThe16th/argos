[project]
name = "argos"
version = "0.4.2"
description = "Astrophotography control and differential photometry for ZWO Seestar telescopes via ASCOM Alpaca"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "PyQt6==6.7.1",
    "PyQt6-Qt6==6.7.1",
    # pyqtgraph 0.14.0 has a circular import in pyqtgraph.Qt against PyQt6 6.7.1
    # ("cannot import name 'internals' from partially initialized module
    # pyqtgraph.Qt"). Pin to the last known-good 0.13 line until upstream fixes it.
    "pyqtgraph>=0.13.0,<0.14.0",
    "requests>=2.31.0",
    "astropy>=6.0.0",
    "numpy>=1.26.0,<2.0.0",
    "alpyca>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "tomlkit>=0.14.0",
    "pyhocon>=0.3.63",
    "blinker>=1.9.0",
    "pydash>=8.0.6",
    "geomag>=0.9.2015",
    "tzlocal>=5.3.1",
]
docs = [
    "sphinx>=7.0.0",
    "myst-parser>=2.0.0",
    "furo>=2024.0.0",
    "sphinx-design>=0.6.0",
    "sphinx-copybutton>=0.5.0",
]
# Binary packaging. Kept out of `dev` so contributors don't pay for a
# toolchain they only need at release time.
package = [
    "pyinstaller>=6.6.0",
]

[tool.uv]
python-preference = "only-system"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# Prevent pytest-qt from auto-loading PyQt6 in headless/CI environments.
# Tests that genuinely need Qt must request the `qtbot` fixture explicitly.
qt_default_raising = false
addopts = "-p no:qt"
